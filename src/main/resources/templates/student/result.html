<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{common/layout :: head(title='My Results')}"></head>
<body>
<div class="app-wrapper">
    <nav th:replace="~{common/layout :: sidebar(activePage='result')}"></nav>

    <div class="main-content">
        <header th:replace="~{common/layout :: topbar(title='Semester Results')}"></header>

        <div class="content-area">

            <div class="card mb-3">
                <div class="card-body text-center">
                    <h5 th:text="${student.fullName}"></h5>
                    <p class="text-muted mb-1">
                        <span th:text="${student.enrollmentNo}"></span> | <span th:text="${student.department}"></span>
                    </p>
                    <div class="stat-card bg-gradient-primary d-inline-block px-5 mt-2">
                        <div class="stat-value" th:text="${overallAverage} + '%'">0%</div>
                        <div class="stat-label">Overall Average</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="bi bi-award-fill me-2"></i>Semester-wise Results</div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr><th>Semester</th><th>Average Marks</th><th>Result</th><th>Status</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="entry : ${semesterResults}">
                                <td>Semester <span th:text="${entry.key}"></span></td>
                                <td th:text="${semesterAverages.get(entry.key)} + '%'"></td>
                                <td>
                                    <span class="badge fs-6" th:classappend="${entry.value == 'FAIL'} ? 'bg-danger' : 'badge-grade-' + ${entry.value}"
                                          th:text="${entry.value}"></span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${entry.value == 'FAIL'} ? 'bg-danger' : 'bg-success'"
                                          th:text="${entry.value == 'FAIL'} ? 'FAIL' : 'PASS'"></span>
                                </td>
                            </tr>
                            <tr th:if="${#maps.isEmpty(semesterResults)}">
                                <td colspan="4" class="text-center text-muted py-3">No results published yet</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="alert alert-info mt-3">
                <i class="bi bi-info-circle-fill me-2"></i>
                Grade Legend: O (90-100%) | A+ (80-89%) | A (70-79%) | B+ (60-69%) | B (50-59%) | C (40-49%) | F (Below 40%)
            </div>

        </div>

        <footer class="app-footer">&copy; 2026 Smart College ERP Portal. All rights reserved.</footer>
    </div>
</div>

<div th:replace="~{common/layout :: scripts}"></div>
</body>
</html>
