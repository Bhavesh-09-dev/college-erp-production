<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-page">
    <div class="login-card card" style="max-width: 480px;">
        <div class="login-header bg-gradient-warning" style="color:#333;">
            <i class="bi bi-shield-lock-fill"></i>
            <h3 class="mb-1">403</h3>
            <p class="mb-0 opacity-75">Access Denied</p>
        </div>
        <div class="login-body text-center">
            <p class="text-muted">
                You do not have permission to access this page. Please contact the administrator
                if you believe this is an error.
            </p>
            <a href="/" class="btn btn-primary mt-2">
                <i class="bi bi-house-fill me-2"></i>Go to Home
            </a>
        </div>
    </div>
</div>
</body>
</html>
