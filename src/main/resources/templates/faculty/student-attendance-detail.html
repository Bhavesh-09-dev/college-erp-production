<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{common/layout :: head(title='Attendance Detail')}"></head>
<body>
<div class="app-wrapper">
    <nav th:replace="~{common/layout :: sidebar(activePage='attendance-reports')}"></nav>

    <div class="main-content">
        <header th:replace="~{common/layout :: topbar(title='Student Attendance Detail')}"></header>

        <div class="content-area">

            <div class="card mb-3">
                <div class="card-body">
                    <h5 th:text="${student.fullName}"></h5>
                    <p class="text-muted mb-0">
                        <span th:text="${student.enrollmentNo}"></span> |
                        <span th:text="${student.department}"></span> |
                        Semester <span th:text="${student.semester}"></span>
                    </p>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <div class="stat-card bg-gradient-info">
                        <i class="bi bi-calendar-check-fill stat-icon"></i>
                        <div class="stat-value" th:text="${summary.attendancePercentage} + '%'">0%</div>
                        <div class="stat-label">Overall Attendance</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card bg-gradient-success">
                        <i class="bi bi-check-circle-fill stat-icon"></i>
                        <div class="stat-value" th:text="${summary.presentCount}">0</div>
                        <div class="stat-label">Classes Present</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card bg-gradient-danger">
                        <i class="bi bi-x-circle-fill stat-icon"></i>
                        <div class="stat-value" th:text="${summary.absentCount}">0</div>
                        <div class="stat-label">Classes Absent</div>
                    </div>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header"><i class="bi bi-bar-chart-fill me-2"></i>Subject-wise Attendance</div>
                <div class="card-body">
                    <div th:each="entry : ${subjectAttendance}" class="mb-2">
                        <div class="d-flex justify-content-between small mb-1">
                            <span th:text="${entry.key}"></span>
                            <strong th:text="${entry.value} + '%'"></strong>
                        </div>
                        <div class="progress">
                            <div class="progress-bar attendance-progress" role="progressbar"
                                 th:style="'width:' + ${entry.value} + '%'"
                                 th:data-attendance-bar="${entry.value}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="bi bi-list-ul me-2"></i>Attendance History</div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table mb-0">
                            <thead><tr><th>Date</th><th>Subject</th><th>Status</th><th>Remarks</th></tr></thead>
                            <tbody>
                            <tr th:each="a : ${attendanceList}">
                                <td th:text="${a.attendanceDate}"></td>
                                <td th:text="${a.subject}"></td>
                                <td>
                                    <span class="badge" th:classappend="${a.status.name() == 'PRESENT'} ? 'bg-success' :
                                            (${a.status.name() == 'ABSENT'} ? 'bg-danger' :
                                            (${a.status.name() == 'LATE'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                          th:text="${a.status}"></span>
                                </td>
                                <td th:text="${a.remarks ?: '-'}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <a th:href="@{/faculty/attendance/reports}" class="btn btn-outline-secondary mt-3">
                <i class="bi bi-arrow-left me-1"></i> Back to Reports
            </a>

        </div>

        <footer class="app-footer">&copy; 2026 Smart College ERP Portal. All rights reserved.</footer>
    </div>
</div>

<div th:replace="~{common/layout :: scripts}"></div>
</body>
</html>
