<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{common/layout :: head(title='Edit Marks')}"></head>
<body>
<div class="app-wrapper">
    <nav th:replace="~{common/layout :: sidebar(activePage='marks')}"></nav>

    <div class="main-content">
        <header th:replace="~{common/layout :: topbar(title='Edit Marks')}"></header>

        <div class="content-area">

            <div class="card">
                <div class="card-header"><i class="bi bi-pencil-square me-2"></i>Edit Marks Entry</div>
                <div class="card-body">
                    <form th:action="@{/faculty/marks/{id}(id=${marks.id})}" th:object="${marks}" method="post">
                        <input type="hidden" th:field="*{studentId}">

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Student</label>
                                <input type="text" class="form-control" th:value="${marks.studentName} + ' (' + ${marks.enrollmentNo} + ')'" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Subject *</label>
                                <input type="text" class="form-control" th:field="*{subject}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></div>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Marks Obtained *</label>
                                <input type="number" step="0.1" class="form-control" th:field="*{marksObtained}" min="0" max="100">
                                <div class="text-danger small" th:if="${#fields.hasErrors('marksObtained')}" th:errors="*{marksObtained}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Max Marks *</label>
                                <input type="number" step="0.1" class="form-control" th:field="*{maxMarks}" min="1" max="100">
                                <div class="text-danger small" th:if="${#fields.hasErrors('maxMarks')}" th:errors="*{maxMarks}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Semester *</label>
                                <input type="number" class="form-control" th:field="*{semester}" min="1" max="8">
                                <div class="text-danger small" th:if="${#fields.hasErrors('semester')}" th:errors="*{semester}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Exam Type *</label>
                                <select class="form-select" th:field="*{examType}">
                                    <option th:each="e : ${examTypes}" th:value="${e}" th:text="${e}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Academic Year</label>
                                <input type="text" class="form-control" th:field="*{academicYear}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Remarks</label>
                                <input type="text" class="form-control" th:field="*{remarks}">
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-1"></i> Update Marks
                            </button>
                            <a th:href="@{/faculty/marks/student/{id}(id=${marks.studentId})}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        </div>

        <footer class="app-footer">&copy; 2026 Smart College ERP Portal. All rights reserved.</footer>
    </div>
</div>

<div th:replace="~{common/layout :: scripts}"></div>
</body>
</html>
