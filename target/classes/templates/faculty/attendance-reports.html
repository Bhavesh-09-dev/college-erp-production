<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{common/layout :: head(title='Attendance Reports')}"></head>
<body>
<div class="app-wrapper">
    <nav th:replace="~{common/layout :: sidebar(activePage='attendance-reports')}"></nav>

    <div class="main-content">
        <header th:replace="~{common/layout :: topbar(title='Attendance Reports')}"></header>

        <div class="content-area">

            <div class="card mb-3">
                <div class="card-header"><i class="bi bi-filter-circle-fill me-2"></i>Select Class</div>
                <div class="card-body">
                    <form method="get" th:action="@{/faculty/attendance/reports}" class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label">Department</label>
                            <select class="form-select" name="department" required>
                                <option value="">Select Department</option>
                                <option th:each="d : ${departments}" th:value="${d}" th:text="${d}"
                                        th:selected="${d == selectedDepartment}"></option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Semester</label>
                            <select class="form-select" name="semester" required>
                                <option value="">Select Semester</option>
                                <option th:each="i : ${#numbers.sequence(1,8)}" th:value="${i}"
                                        th:text="'Semester ' + ${i}" th:selected="${i == selectedSemester}"></option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search me-1"></i> View
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card" th:if="${!#lists.isEmpty(students)}">
                <div class="card-header">
                    <i class="bi bi-bar-chart-fill me-2"></i>
                    Attendance Report - <span th:text="${selectedDepartment}"></span> | Semester <span th:text="${selectedSemester}"></span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                            <tr>
                                <th>Enrollment No</th>
                                <th>Name</th>
                                <th style="width:200px;">Attendance %</th>
                                <th>Status</th>
                                <th class="text-end">Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="s : ${students}">
                                <td th:text="${s.enrollmentNo}"></td>
                                <td th:text="${s.fullName}"></td>
                                <td>
                                    <div class="progress">
                                        <div class="progress-bar attendance-progress" role="progressbar"
                                             th:style="'width:' + ${s.attendancePercentage} + '%'"
                                             th:data-attendance-bar="${s.attendancePercentage}"
                                             th:text="${s.attendancePercentage} + '%'"></div>
                                    </div>
                                </td>
                                <td>
                                    <span th:if="${s.attendancePercentage >= 75}" class="badge bg-success">Good</span>
                                    <span th:if="${s.attendancePercentage >= 60 and s.attendancePercentage < 75}" class="badge bg-warning text-dark">At Risk</span>
                                    <span th:if="${s.attendancePercentage < 60}" class="badge bg-danger">Critical</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/faculty/attendance/student/{id}(id=${s.id})}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye me-1"></i>Details
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(students)}" class="card">
                <div class="card-body empty-state">
                    <i class="bi bi-bar-chart"></i>
                    <p>Select a department and semester to view attendance reports</p>
                </div>
            </div>

        </div>

        <footer class="app-footer">&copy; 2026 Smart College ERP Portal. All rights reserved.</footer>
    </div>
</div>

<div th:replace="~{common/layout :: scripts}"></div>
</body>
</html>
