<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{common/layout :: head(title='Faculty')}"></head>
<body>
<div class="app-wrapper">
    <nav th:replace="~{common/layout :: sidebar(activePage='faculty')}"></nav>

    <div class="main-content">
        <header th:replace="~{common/layout :: topbar(title='Faculty Management')}"></header>

        <div class="content-area">
            <div th:replace="~{common/layout :: alerts}"></div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <span><i class="bi bi-person-badge-fill me-2"></i>All Faculty Members</span>
                    <a th:href="@{/admin/faculty/new}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-circle me-1"></i> Add Faculty
                    </a>
                </div>
                <div class="card-body">

                    <form method="get" th:action="@{/admin/faculty}" class="row g-2 mb-3">
                        <div class="col-md-6">
                            <input type="text" id="searchInput" name="search" class="form-control"
                                   placeholder="Search by name, employee ID, email, department..."
                                   th:value="${search}">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-outline-primary w-100">
                                <i class="bi bi-search"></i> Search
                            </button>
                        </div>
                        <div class="col-md-2" th:if="${search}">
                            <a th:href="@{/admin/faculty}" class="btn btn-outline-secondary w-100">
                                <i class="bi bi-x-circle"></i> Clear
                            </a>
                        </div>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                            <tr>
                                <th>Employee ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Designation</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="f : ${facultyList.content}">
                                <td><strong th:text="${f.employeeId}"></strong></td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="avatar-circle"
                                             th:text="${#strings.substring(f.firstName,0,1)}">A</div>
                                        <span th:text="${f.fullName}"></span>
                                    </div>
                                </td>
                                <td th:text="${f.email}"></td>
                                <td th:text="${f.department}"></td>
                                <td th:text="${f.designation}"></td>
                                <td>
                                    <span class="badge" th:classappend="${f.active} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${f.active} ? 'Active' : 'Inactive'"></span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/admin/faculty/{id}/edit(id=${f.id})}"
                                       class="btn btn-sm btn-outline-primary" title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/admin/faculty/{id}/delete(id=${f.id})}" method="post"
                                          class="d-inline confirm-delete"
                                          data-confirm-message="Are you sure you want to delete this faculty member?">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${facultyList.content.isEmpty()}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox d-block" style="font-size:2rem;"></i>
                                    No faculty members found
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <nav th:if="${facultyList.totalPages > 1}" aria-label="Page navigation">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${facultyList.first} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/faculty(page=${facultyList.number - 1}, search=${search})}">Previous</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, facultyList.totalPages - 1)}"
                                th:classappend="${i == facultyList.number} ? 'active'">
                                <a class="page-link" th:href="@{/admin/faculty(page=${i}, search=${search})}"
                                   th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${facultyList.last} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/faculty(page=${facultyList.number + 1}, search=${search})}">Next</a>
                            </li>
                        </ul>
                    </nav>

                </div>
            </div>
        </div>

        <footer class="app-footer">&copy; 2026 Smart College ERP Portal. All rights reserved.</footer>
    </div>
</div>

<div th:replace="~{common/layout :: scripts}"></div>
</body>
</html>
