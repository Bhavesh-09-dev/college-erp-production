<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{common/layout :: head(title='Students')}"></head>
<body>
<div class="app-wrapper">
    <nav th:replace="~{common/layout :: sidebar(activePage='students')}"></nav>

    <div class="main-content">
        <header th:replace="~{common/layout :: topbar(title='Student Management')}"></header>

        <div class="content-area">
            <div th:replace="~{common/layout :: alerts}"></div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <span><i class="bi bi-people-fill me-2"></i>All Students</span>
                    <a th:href="@{/admin/students/new}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-circle me-1"></i> Add Student
                    </a>
                </div>
                <div class="card-body">

                    <!-- Search Bar -->
                    <form method="get" th:action="@{/admin/students}" class="row g-2 mb-3">
                        <div class="col-md-6">
                            <input type="text" id="searchInput" name="search" class="form-control"
                                   placeholder="Search by name, enrollment no, email, department..."
                                   th:value="${search}">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-outline-primary w-100">
                                <i class="bi bi-search"></i> Search
                            </button>
                        </div>
                        <div class="col-md-2" th:if="${search}">
                            <a th:href="@{/admin/students}" class="btn btn-outline-secondary w-100">
                                <i class="bi bi-x-circle"></i> Clear
                            </a>
                        </div>
                    </form>

                    <!-- Table -->
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                            <tr>
                                <th>Enrollment No</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Semester</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="student : ${students.content}">
                                <td><strong th:text="${student.enrollmentNo}"></strong></td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="avatar-circle"
                                             th:text="${#strings.substring(student.firstName,0,1)}">A</div>
                                        <span th:text="${student.fullName}"></span>
                                    </div>
                                </td>
                                <td th:text="${student.email}"></td>
                                <td th:text="${student.department}"></td>
                                <td><span class="badge bg-info" th:text="'Sem ' + ${student.semester}"></span></td>
                                <td>
                                    <span class="badge" th:classappend="${student.active} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${student.active} ? 'Active' : 'Inactive'"></span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/admin/students/{id}(id=${student.id})}"
                                       class="btn btn-sm btn-outline-info" title="View">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/admin/students/{id}/edit(id=${student.id})}"
                                       class="btn btn-sm btn-outline-primary" title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/admin/students/{id}/delete(id=${student.id})}" method="post"
                                          class="d-inline confirm-delete"
                                          data-confirm-message="Are you sure you want to delete this student?">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${students.content.isEmpty()}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox d-block" style="font-size:2rem;"></i>
                                    No students found
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav th:if="${students.totalPages > 1}" aria-label="Page navigation">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${students.first} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/students(page=${students.number - 1}, search=${search})}">Previous</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, students.totalPages - 1)}"
                                th:classappend="${i == students.number} ? 'active'">
                                <a class="page-link" th:href="@{/admin/students(page=${i}, search=${search})}"
                                   th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${students.last} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/students(page=${students.number + 1}, search=${search})}">Next</a>
                            </li>
                        </ul>
                    </nav>

                    <p class="text-muted text-center small">
                        Showing page <span th:text="${students.number + 1}"></span> of
                        <span th:text="${students.totalPages}"></span>
                        (<span th:text="${students.totalElements}"></span> total students)
                    </p>

                </div>
            </div>
        </div>

        <footer class="app-footer">&copy; 2026 Smart College ERP Portal. All rights reserved.</footer>
    </div>
</div>

<div th:replace="~{common/layout :: scripts}"></div>
</body>
</html>
